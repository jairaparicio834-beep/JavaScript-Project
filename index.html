<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="https://kit.fontawesome.com/eea87085bb.js" crossorigin="anonymous"></script>
</head>

<body>
    <section>
        <div class="movie__background">
            <figure class="movie__background__wrapper">
                <div class="nav__content">
                    <div class="nav__left">
                        <figure class="nav__logo__wrapper">
                            <img src="https://ticket-streaming-site.vercel.app/assets/movielogo.png"
                                class="nav__logo__img" alt="">
                        </figure>
                        <a href="" class="nav__link">Home</a>
                        <a href="" class="nav__link">Contact</a>
                    </div>
                    <div class="nav__right">
                        <div class="nav__input__wrapper">
                            <input type="text" class="nav__input" placeholder="Find a movie">
                            <i class="fa-solid fa-magnifying-glass nav__search" onclick="openSearch()"></i>
                        </div>
                        <i class="fa-solid fa-gear nav__settings"></i>
                    </div>
                </div>
                <img src="https://ticket-streaming-site.vercel.app/assets/moviebackground.jpg"
                    class="movie__background__img" alt="">
                <div class="movie__background__text">
                    <h1 class="movie__background__title">Ticket <span class="color-primary">+</span></h1>
                    <h3 class="movie__background__subtitle">With over <span class="color-primary">3000</span> movies on
                        Ticket <span class="color-primary">+</span>, the possibilites are endless!
                    </h3>
                    <div class="movie__background__search">
                        <div class="movie__input__wrapper">
                            <input type="text" class="movie__input" placeholder="Find a movie">
                            <i class="fa-solid fa-magnifying-glass movie__icon" onclick="getMovies()"></i>
                        </div>
                    </div>
                </div>
            </figure>
        </div>
    </section>

                                        <div class="movie__info">
                                            <i class="fa-solid fa-star movie__info--icon"></i>
